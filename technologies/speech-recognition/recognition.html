<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CALL Blog</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="../../styles.css" />
    <link href="./recorder.css" rel="stylesheet" />
   </head>

  <body id="top">
    <div class="header">
      <div class="header-content">
        <div class="text-container">
          <h1 class="banner-pill">Computer Assisted language Learning</h1>
          <p class="banner-pill">by Juan Pablo Mendoza</p>
        </div>
      </div>
    </div>
    <div class="page-container">
      <nav class="top-dropdown-nav" aria-label="Compact section navigation"></nav>
      <nav class="side-tab" aria-label="Section navigation"></nav>

      <div class="main-content">
        <div class="container blog-post-container">
          <article class="blog-post">
            <div class="center">
              <a href="../../index.html" class="back-button">← Back to Home</a>
              <h1>Speech Recognition</h1>
            </div>
            <p>
              On this page, you can record your voice and use Speech Recognition to see it as text.
            </p>

            <section class="main-controls">
              <canvas class="visualizer" height="60px"></canvas>
              <div id="buttons">
                <button class="record">Record</button>
                <button class="stop">Stop</button>
              </div>
            </section>

            <!-- Insert audio recorder below this line  -->
            <p id="speechRecognitionText"></p>
            <section class="sound-clips"></section>

          </article>

        </div>
      </div>
    </div>
    <script src="./convert-audio.js"></script>
    <script src="./recognition.js"></script>
    <script src="./recorder.js"></script>
    <script src="../../scripts/site.js"></script>
  </body>
</html>
