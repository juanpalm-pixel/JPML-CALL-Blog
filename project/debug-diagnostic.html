<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irish E-Reader - Diagnostic Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .diagnostic-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .diagnostic-card h2 {
            color: #333;
            font-size: 1.3em;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 3px solid #667eea;
        }
        
        .test-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            background: #f8f9fa;
            border-left: 4px solid #ddd;
        }
        
        .test-item.pass {
            background: #d4edda;
            border-left-color: #28a745;
        }
        
        .test-item.fail {
            background: #f8d7da;
            border-left-color: #dc3545;
        }
        
        .test-item.warning {
            background: #fff3cd;
            border-left-color: #ffc107;
        }
        
        .status-icon {
            font-size: 1.5em;
            margin-right: 12px;
            font-weight: bold;
            width: 30px;
        }
        
        .test-content {
            flex: 1;
        }
        
        .test-label {
            font-weight: 600;
            color: #333;
        }
        
        .test-detail {
            font-size: 0.9em;
            color: #666;
            margin-top: 4px;
        }
        
        .console-output {
            background: #1e1e1e;
            color: #00ff00;
            border-radius: 8px;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 12px;
            border: 1px solid #444;
        }
        
        .console-line {
            margin: 4px 0;
        }
        
        .console-error {
            color: #ff6b6b;
        }
        
        .console-warn {
            color: #ffd93d;
        }
        
        .console-log {
            color: #00ff00;
        }
        
        .console-info {
            color: #4ecdc4;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.95em;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .input-group {
            margin-top: 12px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
        }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95em;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .summary {
            background: #e8f5e9;
            border-left: 4px solid #28a745;
            padding: 16px;
            border-radius: 6px;
            margin-top: 12px;
        }
        
        .summary.warning {
            background: #fff3cd;
            border-left-color: #ffc107;
        }
        
        .summary.error {
            background: #f8d7da;
            border-left-color: #dc3545;
        }
        
        .summary h3 {
            margin-bottom: 8px;
        }
        
        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: #d63384;
        }
        
        .fix-list {
            list-style: none;
            margin-top: 12px;
        }
        
        .fix-list li {
            padding: 8px;
            margin: 4px 0;
            background: #f0f0f0;
            border-left: 3px solid #667eea;
            border-radius: 3px;
        }
        
        .fix-list li strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Irish E-Reader Diagnostic Tool</h1>
        
        <!-- Initialization Test -->
        <div class="diagnostic-card">
            <h2>1️⃣ Service Initialization Status</h2>
            <div id="init-tests"></div>
        </div>
        
        <!-- API Key Test -->
        <div class="diagnostic-card">
            <h2>2️⃣ API Key Configuration</h2>
            <div id="api-tests"></div>
            <div class="input-group">
                <label for="tts-key">TTS API Key:</label>
                <input type="password" id="tts-key" placeholder="Paste your TTS API key">
            </div>
            <div class="input-group">
                <label for="stt-key">STT API Key:</label>
                <input type="password" id="stt-key" placeholder="Paste your STT API key">
            </div>
            <div class="action-buttons">
                <button class="btn-primary" onclick="testApiKeys()">Test API Keys</button>
                <button class="btn-success" onclick="saveApiKeys()">Save API Keys</button>
                <button class="btn-danger" onclick="clearApiKeys()">Clear Keys</button>
            </div>
        </div>
        
        <!-- Text-to-Speech Test -->
        <div class="diagnostic-card">
            <h2>🔊 Text-to-Speech (TTS) Test</h2>
            <div id="tts-tests"></div>
            <div class="input-group">
                <label for="tts-text">Irish Text to Speak:</label>
                <textarea id="tts-text" placeholder="Enter Irish text (e.g., 'Dia duit, conas atá tú?')">Dia duit, conas atá tú?</textarea>
            </div>
            <div class="action-buttons">
                <button class="btn-primary" onclick="testTTS()">🔊 Test TTS</button>
                <button class="btn-success" onclick="testVoices()">🎤 Check Voices</button>
            </div>
            <div id="tts-audio-output" style="margin-top: 16px;"></div>
        </div>
        
        <!-- Speech-to-Text Test -->
        <div class="diagnostic-card">
            <h2>🎤 Speech-to-Text (STT) Test</h2>
            <div id="stt-tests"></div>
            <div class="input-group">
                <label for="target-text">Target Irish Text to Compare:</label>
                <input type="text" id="target-text" placeholder="The text you want to pronounce" value="Dia duit">
            </div>
            <div class="action-buttons">
                <button class="btn-primary" onclick="testMicrophone()">🎙️ Test Microphone</button>
                <button class="btn-success" onclick="startRecording()">⏹️ Start Recording (5s)</button>
            </div>
            <div id="stt-output" style="margin-top: 16px;"></div>
        </div>
        
        <!-- Browser Capabilities Test -->
        <div class="diagnostic-card">
            <h2>🌐 Browser Capabilities</h2>
            <div id="browser-tests"></div>
        </div>
        
        <!-- Console Output -->
        <div class="diagnostic-card">
            <h2>📋 Diagnostic Console</h2>
            <div id="console-output" class="console-output"></div>
            <div class="action-buttons">
                <button class="btn-danger" onclick="clearConsole()">Clear Console</button>
                <button class="btn-primary" onclick="downloadDiagnostics()">⬇️ Download Report</button>
            </div>
        </div>
        
        <!-- Known Issues Summary -->
        <div class="diagnostic-card">
            <h2>⚠️ Known Issues & Fixes</h2>
            <div id="issues-summary"></div>
        </div>
    </div>

    <script>
        // Diagnostic logging system
        const diagnosticConsole = {
            logs: [],
            
            log(...args) {
                const message = args.join(' ');
                this.logs.push({ type: 'log', message, timestamp: new Date() });
                console.log(...args);
                this.render();
            },
            
            error(...args) {
                const message = args.join(' ');
                this.logs.push({ type: 'error', message, timestamp: new Date() });
                console.error(...args);
                this.render();
            },
            
            warn(...args) {
                const message = args.join(' ');
                this.logs.push({ type: 'warn', message, timestamp: new Date() });
                console.warn(...args);
                this.render();
            },
            
            info(...args) {
                const message = args.join(' ');
                this.logs.push({ type: 'info', message, timestamp: new Date() });
                console.info(...args);
                this.render();
            },
            
            render() {
                const output = document.getElementById('console-output');
                if (output) {
                    output.innerHTML = this.logs.map(log => {
                        const time = log.timestamp.toLocaleTimeString();
                        const className = `console-line console-${log.type}`;
                        return `<div class="${className}">[${time}] ${log.message}</div>`;
                    }).join('');
                    output.scrollTop = output.scrollHeight;
                }
            },
            
            clear() {
                this.logs = [];
                this.render();
            }
        };

        // Override console methods for diagnostics
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        const originalInfo = console.info;

        console.log = (...args) => {
            originalLog(...args);
            diagnosticConsole.log(...args);
        };

        console.error = (...args) => {
            originalError(...args);
            diagnosticConsole.error(...args);
        };

        console.warn = (...args) => {
            originalWarn(...args);
            diagnosticConsole.warn(...args);
        };

        console.info = (...args) => {
            originalInfo(...args);
            diagnosticConsole.info(...args);
        };

        // Test functions
        function addTest(label, passed, detail) {
            return `
                <div class="test-item ${passed ? 'pass' : 'fail'}">
                    <div class="status-icon">${passed ? '✓' : '✗'}</div>
                    <div class="test-content">
                        <div class="test-label">${label}</div>
                        ${detail ? `<div class="test-detail">${detail}</div>` : ''}
                    </div>
                </div>
            `;
        }

        function runInitTests() {
            diagnosticConsole.log('=== Running Initialization Tests ===');
            let html = '';
            
            // Check if localStorage is available
            try {
                localStorage.setItem('test', 'test');
                localStorage.removeItem('test');
                html += addTest('LocalStorage Available', true, 'Can store settings locally');
                diagnosticConsole.log('✓ LocalStorage: Available');
            } catch (e) {
                html += addTest('LocalStorage Available', false, e.message);
                diagnosticConsole.error('✗ LocalStorage: Not available');
            }
            
            // Check if Web Audio API is supported
            const audioContext = window.AudioContext || window.webkitAudioContext;
            html += addTest('Web Audio API', !!audioContext, 
                audioContext ? 'AudioContext available' : 'AudioContext not supported');
            diagnosticConsole.log(`${audioContext ? '✓' : '✗'} Web Audio API: ${audioContext ? 'Supported' : 'Not supported'}`);
            
            // Check for specific script availability
            const hasGoogleAPI = !!window.google;
            html += addTest('Google Cloud Library', hasGoogleAPI, 
                hasGoogleAPI ? 'window.google available' : 'Google library not loaded');
            diagnosticConsole.log(`${hasGoogleAPI ? '✓' : '✗'} Google Cloud Library: ${hasGoogleAPI ? 'Available' : 'Not available'}`);
            
            document.getElementById('init-tests').innerHTML = html;
        }

        function runApiTests() {
            diagnosticConsole.log('=== Checking API Key Storage ===');
            let html = '';
            
            const ttsKey = localStorage.getItem('ereader-tts-key');
            const sttKey = localStorage.getItem('ereader-stt-key');
            const oldTtsKey = localStorage.getItem('google_cloud_api_key');
            
            html += addTest('TTS API Key Stored (ereader-tts-key)', !!ttsKey, 
                ttsKey ? `Found: ${ttsKey.substring(0, 10)}...` : 'Not found');
            diagnosticConsole.log(`${ttsKey ? '✓' : '✗'} TTS Key (ereader-tts-key): ${ttsKey ? 'Found' : 'Not found'}`);
            
            html += addTest('STT API Key Stored (ereader-stt-key)', !!sttKey, 
                sttKey ? `Found: ${sttKey.substring(0, 10)}...` : 'Not found');
            diagnosticConsole.log(`${sttKey ? '✓' : '✗'} STT Key (ereader-stt-key): ${sttKey ? 'Found' : 'Not found'}`);
            
            if (oldTtsKey) {
                html += addTest('Old API Key Format', true, '⚠️ Found old google_cloud_api_key - should migrate');
                diagnosticConsole.warn('⚠️ Found old API key format (google_cloud_api_key) - should use new format');
            }
            
            document.getElementById('api-tests').innerHTML = html;
        }

        function runBrowserTests() {
            diagnosticConsole.log('=== Running Browser Compatibility Tests ===');
            let html = '';
            
            // Check media devices
            const hasMediaDevices = !!navigator.mediaDevices && !!navigator.mediaDevices.getUserMedia;
            html += addTest('Microphone Access (getUserMedia)', hasMediaDevices, 
                hasMediaDevices ? 'Supported' : 'Not supported - recording will not work');
            diagnosticConsole.log(`${hasMediaDevices ? '✓' : '✗'} getUserMedia: ${hasMediaDevices ? 'Available' : 'Not available'}`);
            
            // Check for WebRTC
            const hasWebRTC = !!navigator.mediaDevices;
            html += addTest('WebRTC Support', hasWebRTC, 
                hasWebRTC ? 'Supported' : 'Not supported');
            diagnosticConsole.log(`${hasWebRTC ? '✓' : '✗'} WebRTC: ${hasWebRTC ? 'Available' : 'Not available'}`);
            
            // Check for fetch API
            const hasFetch = !!window.fetch;
            html += addTest('Fetch API', hasFetch, 
                hasFetch ? 'Can make API requests' : 'Cannot make API requests');
            diagnosticConsole.log(`${hasFetch ? '✓' : '✗'} Fetch API: ${hasFetch ? 'Available' : 'Not available'}`);
            
            // Browser info
            const userAgent = navigator.userAgent;
            const browserInfo = userAgent.substring(0, 100);
            diagnosticConsole.info(`Browser: ${browserInfo}`);
            
            document.getElementById('browser-tests').innerHTML = html;
        }

        function testApiKeys() {
            diagnosticConsole.log('=== Testing API Keys ===');
            const ttsKey = document.getElementById('tts-key').value.trim();
            const sttKey = document.getElementById('stt-key').value.trim();
            
            if (!ttsKey) {
                diagnosticConsole.error('✗ TTS API Key is empty');
                alert('Please enter TTS API Key');
                return;
            }
            
            if (!sttKey) {
                diagnosticConsole.error('✗ STT API Key is empty');
                alert('Please enter STT API Key');
                return;
            }
            
            // Validate key format (should be roughly 40+ characters)
            const keyValid = ttsKey.length > 20 && sttKey.length > 20;
            diagnosticConsole.log(`TTS Key length: ${ttsKey.length} ${ttsKey.length > 20 ? '✓' : '✗'}`);
            diagnosticConsole.log(`STT Key length: ${sttKey.length} ${sttKey.length > 20 ? '✓' : '✗'}`);
            
            if (keyValid) {
                diagnosticConsole.info('Keys appear to be in valid format. They will be tested during TTS/STT tests.');
            } else {
                diagnosticConsole.warn('⚠️ Keys may not be valid - they appear too short');
            }
        }

        function saveApiKeys() {
            diagnosticConsole.log('=== Saving API Keys ===');
            const ttsKey = document.getElementById('tts-key').value.trim();
            const sttKey = document.getElementById('stt-key').value.trim();
            
            if (!ttsKey || !sttKey) {
                diagnosticConsole.error('Cannot save: both API keys are required');
                alert('Please enter both API keys');
                return;
            }
            
            try {
                // Save with the correct keys that match the service code
                localStorage.setItem('ereader-tts-key', ttsKey);
                localStorage.setItem('ereader-stt-key', sttKey);
                diagnosticConsole.info('✓ API keys saved successfully to localStorage');
                alert('API keys saved! Refresh the main page to use them.');
            } catch (e) {
                diagnosticConsole.error('Failed to save API keys:', e.message);
                alert('Failed to save keys: ' + e.message);
            }
        }

        function clearApiKeys() {
            if (confirm('Are you sure you want to clear stored API keys?')) {
                try {
                    localStorage.removeItem('ereader-tts-key');
                    localStorage.removeItem('ereader-stt-key');
                    localStorage.removeItem('google_cloud_api_key');
                    document.getElementById('tts-key').value = '';
                    document.getElementById('stt-key').value = '';
                    diagnosticConsole.info('✓ All API keys cleared');
                    runApiTests();
                } catch (e) {
                    diagnosticConsole.error('Failed to clear keys:', e.message);
                }
            }
        }

        function testTTS() {
            const text = document.getElementById('tts-text').value;
            if (!text) {
                alert('Please enter Irish text');
                return;
            }
            diagnosticConsole.log('TTS test would synthesize: "' + text + '"');
            diagnosticConsole.info('Note: Full TTS test requires actual Google Cloud API implementation');
        }

        function testMicrophone() {
            diagnosticConsole.log('=== Testing Microphone Access ===');
            
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                diagnosticConsole.error('getUserMedia not supported in this browser');
                alert('Microphone access not supported');
                return;
            }
            
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    diagnosticConsole.info('✓ Microphone access granted');
                    // Stop the stream immediately
                    stream.getTracks().forEach(track => track.stop());
                })
                .catch(err => {
                    diagnosticConsole.error('✗ Microphone access denied:', err.message);
                    alert('Microphone access denied: ' + err.message);
                });
        }

        function startRecording() {
            diagnosticConsole.log('Recording feature would start here');
        }

        function testVoices() {
            diagnosticConsole.log('Available voices would be listed here');
        }

        function clearConsole() {
            diagnosticConsole.clear();
        }

        function downloadDiagnostics() {
            const report = diagnosticConsole.logs.map(log => 
                `[${log.timestamp.toISOString()}] [${log.type.toUpperCase()}] ${log.message}`
            ).join('\n');
            
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(report));
            element.setAttribute('download', 'ereader-diagnostics.txt');
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
            diagnosticConsole.info('✓ Diagnostics report downloaded');
        }

        function showKnownIssues() {
            const issuesHtml = `
                <div class="summary error">
                    <h3>🔴 Critical Issues Found</h3>
                    <ul class="fix-list">
                        <li><strong>API Key Storage Mismatch:</strong> UI saves keys as <code>ereader-tts-key</code> but services look for <code>google_cloud_api_key</code>
                            <br><em>Fix: Update services to use the correct localStorage keys</em></li>
                        <li><strong>Missing Methods:</strong> ereader.js calls <code>transcribeAudio()</code> and <code>comparePronunciation()</code> which don't exist in stt-service.js
                            <br><em>Fix: Use <code>speechToText()</code> instead or implement missing methods</em></li>
                        <li><strong>Missing setupUI():</strong> ereader.js calls <code>this.setupUI()</code> but method is not defined
                            <br><em>Fix: Remove the call or create the method</em></li>
                    </ul>
                </div>
                <div class="summary warning">
                    <h3>🟡 Medium Issues</h3>
                    <ul class="fix-list">
                        <li><strong>Duplicate Script:</strong> google-cloud-test.js is loaded twice in index.html</li>
                        <li><strong>No Error Recovery:</strong> TTS and STT services don't handle initialization errors gracefully</li>
                        <li><strong>Voice Config Issues:</strong> ga-IE-Wavenet-A voice may not exist - fallback to Standard-A</li>
                    </ul>
                </div>
            `;
            document.getElementById('issues-summary').innerHTML = issuesHtml;
        }

        // Initialize on page load
        window.addEventListener('load', function() {
            diagnosticConsole.log('🚀 Irish E-Reader Diagnostic Tool Started');
            diagnosticConsole.log('Document ready, running diagnostics...');
            
            runInitTests();
            runApiTests();
            runBrowserTests();
            showKnownIssues();
            
            diagnosticConsole.log('✓ All diagnostics complete');
        });

        // Log any script errors
        window.addEventListener('error', function(event) {
            diagnosticConsole.error('Script Error:', event.message, 'at', event.filename, 'line', event.lineno);
        });

        // Log unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
            diagnosticConsole.error('Unhandled Promise Rejection:', event.reason);
        });
    </script>
</body>
</html>
