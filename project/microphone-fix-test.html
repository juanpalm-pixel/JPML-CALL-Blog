<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microphone Recording Fix Test</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .test-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px solid #28a745;
        }
        
        .test-status {
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 4px;
            font-family: monospace;
        }
        
        .status-info { background: #d1ecf1; color: #0c5460; }
        .status-success { background: #d4edda; color: #155724; }
        .status-error { background: #f8d7da; color: #721c24; }
        .status-warning { background: #fff3cd; color: #856404; }
        
        .controls {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn-primary { background: #007bff; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-warning { background: #ffc107; color: #212529; }
        .btn-success { background: #28a745; color: white; }
        .btn:disabled { background: #6c757d; cursor: not-allowed; }
        
        .log-area {
            background: #2d3748;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .timestamp { color: #68d391; }
        .level-info { color: #63b3ed; }
        .level-warn { color: #f6e05e; }
        .level-error { color: #fc8181; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🎤 Microphone Recording Fix Test</h1>
        <p>Testing the fixed recording race condition and state management.</p>
        
        <div class="test-status status-info" id="test-status">
            Ready to test microphone recording fixes...
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="test-basic-record" onclick="testBasicRecording()">
                Test Basic Recording
            </button>
            <button class="btn btn-danger" id="test-race-condition" onclick="testRaceCondition()">
                Test Race Condition Fix
            </button>
            <button class="btn btn-warning" id="test-timeout" onclick="testTimeoutRecording()">
                Test Timeout Recording
            </button>
            <button class="btn btn-success" id="test-stop-button" onclick="testStopButton()">
                Test Stop Button
            </button>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="record-btn" onclick="startManualRecording()" disabled>
                🎤 Record (Manual)
            </button>
            <button class="btn btn-warning" id="stop-btn" onclick="stopManualRecording()" disabled>
                ⏹ Stop (Manual)
            </button>
            <button class="btn" onclick="clearLog()" style="background: #6c757d; color: white;">
                Clear Log
            </button>
        </div>
        
        <h3>Console Log Output:</h3>
        <div class="log-area" id="log-output"></div>
        
        <h3>Test Results:</h3>
        <div id="test-results"></div>
    </div>

    <script src="scripts/audio-processor.js"></script>
    <script>
        let audioProcessor = null;
        let testResults = {};
        
        // Initialize audio processor
        async function initAudioProcessor() {
            try {
                audioProcessor = new AudioProcessor();
                await audioProcessor.requestMicrophoneAccess();
                logMessage('AudioProcessor initialized successfully', 'info');
                
                // Enable manual test buttons
                document.getElementById('record-btn').disabled = false;
                updateStatus('AudioProcessor ready - run tests or try manual recording', 'success');
            } catch (error) {
                logMessage(`Failed to initialize AudioProcessor: ${error.message}`, 'error');
                updateStatus('Failed to initialize - check microphone permissions', 'error');
            }
        }
        
        function logMessage(message, level = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logOutput = document.getElementById('log-output');
            const levelClass = `level-${level}`;
            logOutput.innerHTML += `<span class="timestamp">[${timestamp}]</span> <span class="${levelClass}">${message}</span>\n`;
            logOutput.scrollTop = logOutput.scrollHeight;
            console.log(`[${level.toUpperCase()}] ${message}`);
        }
        
        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('test-status');
            statusDiv.className = `test-status status-${type}`;
            statusDiv.textContent = message;
        }
        
        function clearLog() {
            document.getElementById('log-output').innerHTML = '';
            document.getElementById('test-results').innerHTML = '';
            testResults = {};
        }
        
        function addTestResult(testName, passed, message) {
            testResults[testName] = { passed, message };
            updateTestResults();
        }
        
        function updateTestResults() {
            const resultsDiv = document.getElementById('test-results');
            let html = '';
            
            for (const [testName, result] of Object.entries(testResults)) {
                const statusClass = result.passed ? 'status-success' : 'status-error';
                const icon = result.passed ? '✅' : '❌';
                html += `<div class="test-status ${statusClass}">${icon} ${testName}: ${result.message}</div>`;
            }
            
            resultsDiv.innerHTML = html;
        }
        
        // Test 1: Basic Recording
        async function testBasicRecording() {
            logMessage('Starting Test 1: Basic Recording', 'info');
            updateStatus('Testing basic recording functionality...', 'info');
            
            try {
                if (!audioProcessor) {
                    throw new Error('AudioProcessor not initialized');
                }
                
                logMessage('Starting recording...', 'info');
                await audioProcessor.startRecording();
                
                logMessage('Recording started successfully - waiting 2 seconds', 'info');
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                logMessage('Stopping recording...', 'info');
                const audioBlob = await audioProcessor.stopRecording();
                
                if (audioBlob && audioBlob.size > 0) {
                    logMessage(`Recording successful: ${audioBlob.size} bytes`, 'info');
                    addTestResult('Basic Recording', true, `Recorded ${audioBlob.size} bytes successfully`);
                } else {
                    throw new Error('No audio data recorded');
                }
                
            } catch (error) {
                logMessage(`Test 1 failed: ${error.message}`, 'error');
                addTestResult('Basic Recording', false, error.message);
            }
        }
        
        // Test 2: Race Condition Fix
        async function testRaceCondition() {
            logMessage('Starting Test 2: Race Condition Fix', 'info');
            updateStatus('Testing race condition fix...', 'info');
            
            try {
                if (!audioProcessor) {
                    throw new Error('AudioProcessor not initialized');
                }
                
                // This should NOT throw "No recording in progress" anymore
                logMessage('Testing recordWithTimeout (was causing race condition)...', 'info');
                
                const recordingPromise = audioProcessor.recordWithTimeout(3, (level) => {
                    // Optional: log level updates
                    if (Math.random() < 0.1) { // Only log occasionally
                        logMessage(`Audio level: ${Math.round(level)}%`, 'info');
                    }
                });
                
                // Wait for completion
                const audioBlob = await recordingPromise;
                
                if (audioBlob && audioBlob.size > 0) {
                    logMessage(`Race condition test passed: ${audioBlob.size} bytes`, 'info');
                    addTestResult('Race Condition Fix', true, 'No "No recording in progress" error');
                } else if (audioBlob === null) {
                    logMessage('Recording timed out as expected', 'info');
                    addTestResult('Race Condition Fix', true, 'Timeout worked correctly, no race condition');
                } else {
                    throw new Error('Unexpected result from recordWithTimeout');
                }
                
            } catch (error) {
                if (error.message.includes('No recording in progress')) {
                    logMessage(`Race condition still exists: ${error.message}`, 'error');
                    addTestResult('Race Condition Fix', false, 'Race condition not fixed');
                } else {
                    logMessage(`Test 2 failed: ${error.message}`, 'error');
                    addTestResult('Race Condition Fix', false, error.message);
                }
            }
        }
        
        // Test 3: Timeout Recording
        async function testTimeoutRecording() {
            logMessage('Starting Test 3: Timeout Recording (2 second timeout)', 'info');
            updateStatus('Testing timeout recording...', 'info');
            
            try {
                if (!audioProcessor) {
                    throw new Error('AudioProcessor not initialized');
                }
                
                const start = Date.now();
                const result = await audioProcessor.recordWithTimeout(2); // 2 second timeout
                const duration = Date.now() - start;
                
                if (result === null && duration >= 2000 && duration < 3000) {
                    logMessage(`Timeout test passed: completed in ${duration}ms`, 'info');
                    addTestResult('Timeout Recording', true, `Timed out correctly after ${duration}ms`);
                } else if (result && result.size > 0) {
                    logMessage(`Recording stopped manually before timeout: ${result.size} bytes in ${duration}ms`, 'info');
                    addTestResult('Timeout Recording', true, `Manual stop worked: ${result.size} bytes`);
                } else {
                    throw new Error(`Unexpected timeout behavior: result=${result}, duration=${duration}ms`);
                }
                
            } catch (error) {
                logMessage(`Test 3 failed: ${error.message}`, 'error');
                addTestResult('Timeout Recording', false, error.message);
            }
        }
        
        // Test 4: Stop Button
        async function testStopButton() {
            logMessage('Starting Test 4: Stop Button Test', 'info');
            updateStatus('Testing stop button functionality...', 'info');
            
            try {
                if (!audioProcessor) {
                    throw new Error('AudioProcessor not initialized');
                }
                
                logMessage('Starting recording...', 'info');
                await audioProcessor.startRecording();
                
                logMessage('Waiting 1 second before stop...', 'info');
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                logMessage('Stopping via stopRecording()...', 'info');
                const audioBlob = await audioProcessor.stopRecording();
                
                if (audioBlob && audioBlob.size > 0) {
                    logMessage(`Stop button test passed: ${audioBlob.size} bytes`, 'info');
                    addTestResult('Stop Button', true, `Manual stop successful: ${audioBlob.size} bytes`);
                } else {
                    throw new Error('Stop did not produce audio blob');
                }
                
            } catch (error) {
                logMessage(`Test 4 failed: ${error.message}`, 'error');
                addTestResult('Stop Button', false, error.message);
            }
        }
        
        // Manual recording controls
        let manualRecordingPromise = null;
        
        async function startManualRecording() {
            try {
                const recordBtn = document.getElementById('record-btn');
                const stopBtn = document.getElementById('stop-btn');
                
                recordBtn.disabled = true;
                stopBtn.disabled = false;
                
                logMessage('Manual recording started...', 'info');
                updateStatus('Recording... click Stop to finish', 'warning');
                
                manualRecordingPromise = audioProcessor.recordWithTimeout(30);
                const result = await manualRecordingPromise;
                
                if (result && result.size > 0) {
                    logMessage(`Manual recording complete: ${result.size} bytes`, 'info');
                    updateStatus('Manual recording successful!', 'success');
                } else {
                    logMessage('Manual recording timed out or was cancelled', 'warn');
                    updateStatus('Manual recording timed out', 'warning');
                }
                
            } catch (error) {
                logMessage(`Manual recording error: ${error.message}`, 'error');
                updateStatus('Manual recording failed', 'error');
            } finally {
                resetManualButtons();
            }
        }
        
        async function stopManualRecording() {
            try {
                if (!audioProcessor.isRecording) {
                    logMessage('No recording in progress', 'warn');
                    return;
                }
                
                logMessage('Stopping manual recording...', 'info');
                await audioProcessor.stopRecording();
                
            } catch (error) {
                logMessage(`Stop error: ${error.message}`, 'error');
            }
        }
        
        function resetManualButtons() {
            document.getElementById('record-btn').disabled = false;
            document.getElementById('stop-btn').disabled = true;
        }
        
        // Initialize when page loads
        window.addEventListener('load', () => {
            logMessage('Page loaded, initializing...', 'info');
            initAudioProcessor();
        });
        
        // Override console methods to capture output
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        console.log = (...args) => {
            originalLog(...args);
            if (args[0] && typeof args[0] === 'string') {
                logMessage(args.join(' '), 'info');
            }
        };
        
        console.error = (...args) => {
            originalError(...args);
            if (args[0] && typeof args[0] === 'string') {
                logMessage(args.join(' '), 'error');
            }
        };
        
        console.warn = (...args) => {
            originalWarn(...args);
            if (args[0] && typeof args[0] === 'string') {
                logMessage(args.join(' '), 'warn');
            }
        };
    </script>
</body>
</html>
