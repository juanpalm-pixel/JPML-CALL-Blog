<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STT Service Fix Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .test-container { max-width: 800px; margin: 0 auto; }
        .status { padding: 1rem; margin: 1rem 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .warning { background: #fff3cd; color: #856404; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 0.5rem 1rem; margin: 0.5rem; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .log { background: #f8f9fa; padding: 1rem; border-radius: 4px; font-family: monospace; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔧 STT Service Fix Test</h1>
        <p>Testing the newly added methods for browser-stt-service.js</p>
        
        <div id="status" class="status info">Ready to test...</div>
        
        <div>
            <button class="btn-primary" onclick="testUpdateConfigForFormat()">Test updateConfigForFormat()</button>
            <button class="btn-primary" onclick="testSpeechToText()">Test speechToText()</button>
            <button class="btn-primary" onclick="testIdentifyPronunciationIssues()">Test identifyPronunciationIssues()</button>
            <button class="btn-danger" onclick="clearLog()">Clear Log</button>
        </div>
        
        <h3>Test Log:</h3>
        <div id="log" class="log">Starting test session...\n</div>
    </div>

    <script src="scripts/browser-stt-service.js"></script>
    <script>
        let sttService = null;
        
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.textContent += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        function clearLog() {
            document.getElementById('log').textContent = '';
        }
        
        // Initialize STT service
        function initSTTService() {
            try {
                sttService = new BrowserSTTService();
                log('BrowserSTTService initialized successfully');
                updateStatus('STT Service ready - run tests', 'success');
                return true;
            } catch (error) {
                log(`Failed to initialize STTService: ${error.message}`);
                updateStatus('Failed to initialize STT service', 'error');
                return false;
            }
        }
        
        function testUpdateConfigForFormat() {
            if (!sttService) {
                log('STT service not initialized');
                return;
            }
            
            log('Testing updateConfigForFormat()...');
            
            try {
                // Test the method that was missing
                sttService.updateConfigForFormat('wav', 16000);
                log('✅ updateConfigForFormat() method exists and executed successfully');
                updateStatus('updateConfigForFormat() test passed', 'success');
            } catch (error) {
                log(`❌ updateConfigForFormat() failed: ${error.message}`);
                updateStatus('updateConfigForFormat() test failed', 'error');
            }
        }
        
        async function testSpeechToText() {
            if (!sttService) {
                log('STT service not initialized');
                return;
            }
            
            log('Testing speechToText()...');
            updateStatus('Testing speechToText()...', 'warning');
            
            try {
                // Create a dummy audio blob for testing
                const dummyBlob = new Blob(['dummy audio data'], { type: 'audio/wav' });
                log(`Created test audio blob: ${dummyBlob.size} bytes`);
                
                const result = await sttService.speechToText(dummyBlob);
                log('✅ speechToText() method exists and returned result:');
                log(`   Transcript: "${result.transcript}"`);
                log(`   Confidence: ${result.confidence}`);
                log(`   Simulated: ${result.simulated}`);
                
                updateStatus('speechToText() test passed', 'success');
            } catch (error) {
                log(`❌ speechToText() failed: ${error.message}`);
                updateStatus('speechToText() test failed', 'error');
            }
        }
        
        function testIdentifyPronunciationIssues() {
            if (!sttService) {
                log('STT service not initialized');
                return;
            }
            
            log('Testing identifyPronunciationIssues()...');
            
            try {
                const expectedText = 'Bhí beantreach bhocht ann fadó';
                const sttResults = {
                    transcript: 'Bhí beantreach bhocht ann fadó',
                    confidence: 0.9
                };
                
                const comparison = sttService.identifyPronunciationIssues(expectedText, sttResults);
                
                log('✅ identifyPronunciationIssues() method exists and returned result:');
                log(`   Overall accuracy: ${comparison.overallAccuracy}`);
                log(`   Quality: ${comparison.quality}`);
                log(`   Word analysis count: ${comparison.wordAnalysis.length}`);
                
                updateStatus('identifyPronunciationIssues() test passed', 'success');
            } catch (error) {
                log(`❌ identifyPronunciationIssues() failed: ${error.message}`);
                updateStatus('identifyPronunciationIssues() test failed', 'error');
            }
        }
        
        // Run tests on load
        window.addEventListener('load', () => {
            log('Page loaded, initializing STT service...');
            if (initSTTService()) {
                log('All required methods should now be available for ereader.js');
                updateStatus('Ready - all methods available', 'success');
            }
        });
    </script>
</body>
</html>
